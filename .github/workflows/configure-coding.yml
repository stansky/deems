name: Configure Deems coding runner
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to connect to the verified code runner
        type: choice
        required: true
        options: [staging, production]
permissions:
  contents: read
jobs:
  configure:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DEEMS_JUDGE0_URL: ${{ vars.DEEMS_JUDGE0_URL }}
      DEEMS_JUDGE0_TOKEN: ${{ secrets.DEEMS_JUDGE0_TOKEN }}
      DEEMS_BACKUP_PUBLIC_KEY: ${{ vars.DEEMS_BACKUP_PUBLIC_KEY }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Connect the verified runner
        shell: node {0}
        run: |
          async function main() {
          const env = process.env;
          for (const name of ['VERCEL_ORG_ID','VERCEL_PROJECT_ID','VERCEL_TOKEN','DEEMS_JUDGE0_URL','DEEMS_JUDGE0_TOKEN']) {
            if (!env[name]) throw new Error(`Missing ${name}`);
          }
          if (!env.DEEMS_JUDGE0_URL.startsWith('https://')) throw new Error('Runner must use HTTPS.');
          for (const key of ['DEEMS_JUDGE0_URL','DEEMS_JUDGE0_TOKEN']) {
            const response = await fetch(`https://api.vercel.com/v10/projects/${env.VERCEL_PROJECT_ID}/env?upsert=true&teamId=${env.VERCEL_ORG_ID}`, {
              method: 'POST', headers: {Authorization: `Bearer ${env.VERCEL_TOKEN}`, 'Content-Type':'application/json'},
              body: JSON.stringify({key,value:env[key],type:'encrypted',target:['production']})
            });
            if (!response.ok) throw new Error(`Could not configure ${key}: HTTP ${response.status}`);
            console.log(`Configured ${key}. Value withheld.`);
          }
          if (env.DEEMS_BACKUP_PUBLIC_KEY) {
            const response = await fetch(`https://api.vercel.com/v10/projects/${env.VERCEL_PROJECT_ID}/env?decrypt=true&teamId=${env.VERCEL_ORG_ID}`, {headers:{Authorization:`Bearer ${env.VERCEL_TOKEN}`}});
            if (!response.ok) throw new Error(`Could not read the database connection: HTTP ${response.status}`);
            const data = await response.json();
            const record = data.envs.find(item => item.key==='DATABASE_URL' && item.target.includes('production'));
            if (!record) throw new Error('Database connection unavailable.');
            const decrypted = await fetch(`https://api.vercel.com/v1/projects/${env.VERCEL_PROJECT_ID}/env/${record.id}?teamId=${env.VERCEL_ORG_ID}`, {headers:{Authorization:`Bearer ${env.VERCEL_TOKEN}`}});
            if (!decrypted.ok) throw new Error(`Database connection could not be decrypted: HTTP ${decrypted.status}`);
            const database = await decrypted.json();
            if (!database.value?.startsWith('postgres')) throw new Error('Database connection unavailable.');
            const crypto = await import('node:crypto');
            const key = crypto.randomBytes(32), iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv('aes-256-gcm',key,iv);
            const encrypted = Buffer.concat([cipher.update(database.value,'utf8'),cipher.final()]);
            const wrapped = crypto.publicEncrypt({key:env.DEEMS_BACKUP_PUBLIC_KEY,oaepHash:'sha256'},key);
            console.log('ENCRYPTED_DATABASE_BACKUP='+JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),data:encrypted.toString('base64')}));
          }
          }
          main().catch(error=>{console.error(error.message);process.exitCode=1;});
