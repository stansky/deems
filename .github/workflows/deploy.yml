name: Deploy Deems
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        options: [staging, production]
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check deployment configuration
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"
          if [ "${{ inputs.environment }}" = production ]; then test "$GITHUB_REF" = refs/heads/main; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:contracts
      - run: npm test
      - run: npx vercel@65.5.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx vercel@65.5.0 build --prod --token="$VERCEL_TOKEN"
      - run: npx vercel@65.5.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
